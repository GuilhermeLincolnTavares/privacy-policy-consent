spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/privacy_consent}
    username: ${DB_USER:consent}
    password: ${DB_PASSWORD:consent}

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that entities match it.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-production-0123456789}
    expiration: 8h

server:
  port: 8080
